# ─────────────────────────────────────────────────────────────────────────────
# OPL Crew Mono — Dev Compose (Local Development, NO BUILD)
#
# Philosophy:
#   - Base images pulled directly from registries — no docker/podman build step
#   - Source code bind-mounted for hot-reload
#   - Python deps cached in named venv volumes (fast after first run)
#   - node_modules cached in a named volume
#
# First run:  deps are installed into venv/node_modules volumes (~3-5 min)
# Subsequent: volumes already populated — services start in seconds
#
# Usage:
#   Core (validator + backend + frontend; skills + Jira are opt-in via profiles):
#     podman compose -f dev-compose.yml up -d
#
#   Optional stacks (combine with --profile flags or COMPOSE_PROFILES):
#     podman compose -f dev-compose.yml --profile skills up -d   # skills-service + skill-manager
#     podman compose -f dev-compose.yml --profile jira up -d     # jira + connector
#     podman compose -f dev-compose.yml --profile skills --profile jira up -d
#
#   Equivalent: COMPOSE_PROFILES=skills,jira podman compose -f dev-compose.yml up -d
#
#   Explicit service list (unchanged):
#     podman compose -f dev-compose.yml up -d backend validator frontend
#     podman compose -f dev-compose.yml --profile skills up -d skills-service skill-manager
#
#   Skills-only without backend/validator:
#     podman compose -f dev-compose.skills.yml up -d
#
#   podman compose -f dev-compose.yml logs -f
#   podman compose -f dev-compose.yml down
#   podman compose -f dev-compose.yml down -v   # full reset (re-installs deps)
#
# Environment:
#   Copy .env.example → .env and fill in LLM_API_KEY before starting.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Keycloak Identity Provider ────────────────────────────────────────────
  keycloak:
    container_name: crew-keycloak-dev
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm --features=token-exchange
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro,z
      - keycloak-data-dev:/opt/keycloak/data/h2
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN:-admin}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-admin}
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q 'UP'"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 10
    networks:
      - crew-dev-net

  # ── Code Validator ────────────────────────────────────────────────────────
  # Base image: ubi9/python-311 (same as Containerfile)
  # Venv cached in validator-venv volume; src mounted for hot-reload.
  validator:
    container_name: crew-validator-dev
    image: registry.access.redhat.com/ubi9/python-311:latest
    user: root
    working_dir: /app
    command:
      - sh
      - -c
      - |
        python3 -m venv /app/venv 2>/dev/null || true
        /app/venv/bin/pip install -q --upgrade pip
        /app/venv/bin/pip install -q \
          'fastapi>=0.115.0' \
          'uvicorn[standard]>=0.32.0' \
          'pydantic>=2.9.0' \
          'PyYAML>=6.0.2'
        export PYTHONPATH=/app/src
        exec /app/venv/bin/uvicorn crew_validator.app:create_app \
          --factory --host 0.0.0.0 --port 8080 \
          --reload --reload-dir /app/src
    ports:
      - "${VALIDATOR_PORT:-8181}:8080"
    volumes:
      - ./crew-code-validator/src:/app/src:z
      - crew-workspace-dev:/app/workspace:ro
      - validator-venv:/app/venv
    environment:
      - LOG_LEVEL=${VALIDATOR_LOG_LEVEL:-DEBUG}
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/app/venv/bin/python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')\""]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 5
    networks:
      - crew-dev-net

  # ── Backend: FastAPI ASGI + AI Agents ─────────────────────────────────────
  # Base image: ubi9/python-311 (same as Containerfile.dev.backend)
  # Venv cached in backend-venv volume; agent/src + crew_studio mounted.
  backend:
    container_name: crew-backend-dev
    image: registry.access.redhat.com/ubi9/python-311:latest
    user: root
    working_dir: /app
    command:
      - sh
      - -c
      - |
        if ! command -v jq >/dev/null 2>&1; then
          dnf install -y --nodocs jq && dnf clean all && rm -rf /var/cache/dnf
        fi
        python3 -m venv /app/venv 2>/dev/null || true
        /app/venv/bin/pip install -q --upgrade pip
        # Install in groups to avoid resolver depth issues
        /app/venv/bin/pip install -q \
          'fastapi>=0.115.0' \
          'uvicorn[standard]>=0.34.0' \
          'httpx>=0.28.0' \
          'PyYAML>=6.0.2' \
          'rich>=13.9.4' \
          'python-dotenv>=1.0.1' \
          'requests>=2.32.3' \
          'flask>=3.0.0' \
          'flask-cors>=4.0.0' \
          'jsonschema[format]>=4.0.0' \
          'cryptography>=41.0.0' \
          'PyJWT>=2.8.0' \
          'gitpython>=3.1.43' \
          'watchdog'
        /app/venv/bin/pip install -q 'litellm>=1.0.0'
        /app/venv/bin/pip install -q \
          'llama-index-core>=0.10.0' \
          'llama-index-agent-openai>=0.2.0' \
          'llama-index-llms-openai>=0.1.0' \
          'llama-index-llms-anthropic>=0.1.0' \
          'llama-index-llms-ollama>=0.1.0' \
          'llama-index-embeddings-openai>=0.1.0' \
          'llama-index-embeddings-huggingface>=0.1.0'
        /app/venv/bin/pip install -q 'llm-tldr>=1.2.0'
        # Context memory plane client (P3). Harmless when MEMORY_ENABLED=false —
        # the wrapper import-guards it and falls back to a disabled no-op.
        /app/venv/bin/pip install -q 'memmachine-client>=0.3.9' || \
          echo "WARNING: memmachine-client install failed; context memory will stay disabled"
        mkdir -p /app/workspace /app/data /app/cache
        cp /app/config.yaml /tmp/config.yaml
        chmod 600 /tmp/config.yaml
        export CONFIG_FILE_PATH=/tmp/config.yaml
        export PYTHONPATH=/app/agent/src:/app/agent:/app
        exec /app/venv/bin/uvicorn crew_studio.asgi_app:app \
          --host 0.0.0.0 --port 8080 \
          --reload \
          --reload-dir /app/crew_studio \
          --reload-dir /app/agent/src \
          --log-level info
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - ./opl-ai-software-team/agent/src:/app/agent/src:z
      - ./opl-ai-software-team/crew_studio:/app/crew_studio:z
      - ${CONFIG_FILE:-./opl-ai-software-team/config.yaml}:/app/config.yaml:z
      - crew-workspace-dev:/app/workspace
      - crew-data-dev:/app/data
      - backend-cache-dev:/app/cache
      - backend-venv:/app/venv
    environment:
      - PARALLEL_FILE_WORKERS=7 
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_API_BASE_URL=${LLM_API_BASE_URL:-https://litellm-prod.apps.maas.redhatworkshops.io}
      - WORKSPACE_PATH=/app/workspace
      - JOB_DB_PATH=/app/data/crew_jobs.db
      - CONFIG_FILE_PATH=/app/config.yaml
      - MOUNT_FLASK_FALLBACK=1
      - VALIDATOR_URL=http://validator:8080
      - SKILLS_SERVICE_URL=${SKILLS_SERVICE_URL:-http://skills-service:8090}
      # Runtime code execution. The Sandbox API runs on the host (it drives the
      # podman CLI directly), so it is reached via the host gateway rather than
      # a compose service. Set SMOKE_TEST_BACKEND=sandbox_api to route the smoke
      # test and feature-test bed through it instead of static analysis.
      - SANDBOX_API_URL=${SANDBOX_API_URL:-http://host.docker.internal:18080}
      - SMOKE_TEST_BACKEND=${SMOKE_TEST_BACKEND:-syntax_only}
      # Context memory plane (P3). Requires --profile memory. Fail-open: with
      # MEMORY_ENABLED unset or the stack down, jobs run unchanged.
      - MEMORY_ENABLED=${MEMORY_ENABLED:-false}
      - MEMMACHINE_BASE_URL=${MEMMACHINE_BASE_URL:-http://memmachine-app:8080}
      - MEMMACHINE_API_KEY=${MEMMACHINE_API_KEY:-}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      - PYTHONUNBUFFERED=1
      - TLDR_BIN=/app/venv/bin/tldr
      - AUTH_ENABLED=${AUTH_ENABLED:-true}
      - KEYCLOAK_ISSUER_URL=${KEYCLOAK_ISSUER_URL:-http://localhost:8180/realms/opl-crew}
      - KEYCLOAK_JWKS_URL=${KEYCLOAK_JWKS_URL:-http://keycloak:8080/realms/opl-crew/protocol/openid-connect/certs}
      - NLTK_DATA=/app/cache/nltk
      - HF_HOME=/tmp/hf
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_USER_NAME=${GITHUB_USER_NAME:-Crew AI}
      - GITHUB_USER_EMAIL=${GITHUB_USER_EMAIL:-crew-ai@noreply.github.com}
      # strict | relaxed (default) | off — see TECH_STACK_MANIFEST_GUARD in .env.example
      - TECH_STACK_MANIFEST_GUARD=${TECH_STACK_MANIFEST_GUARD:-relaxed}
      # Parallel file-generation workers per lane (backend / frontend).
      # Overrides generation.parallel_file_workers in config.yaml when set.
      # Set to 1 for sequential/debug mode; 3-4 for typical MaaS endpoints.
      - PARALLEL_FILE_WORKERS=${PARALLEL_FILE_WORKERS:-}
    extra_hosts:
      # Reaches the Sandbox API running on the host (see SANDBOX_API_URL above).
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/app/venv/bin/python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\""]
      interval: 30s
      timeout: 10s
      start_period: 300s
      retries: 5
    depends_on:
      validator:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - crew-dev-net

  # ── Skills Service (read-only) ────────────────────────────────────────────
  # Profile: skills — not started by default; backend tolerates missing service
  # (skills features disabled until this profile is enabled).
  # Serves: semantic search (/query), MCP (/mcp), list (/skills), reload (/reload)
  # Writes are handled exclusively by skill-manager (port 8091).
  skills-service:
    profiles: [skills]
    container_name: crew-skills-dev
    image: registry.access.redhat.com/ubi9/python-311:latest
    user: root
    working_dir: /app/src
    command:
      - sh
      - -c
      - |
        python3 -m venv /app/venv 2>/dev/null || true
        /app/venv/bin/pip install -q --upgrade pip
        /app/venv/bin/pip install -q \
          'fastapi>=0.110.0' \
          'uvicorn[standard]>=0.29.0' \
          'llama-index-core>=0.10.0' \
          'llama-index-embeddings-huggingface>=0.1.0' \
          'pydantic>=2.0.0' \
          'pyyaml>=6.0.0' \
          'fastmcp>=2.0.0'
        mkdir -p /app/cache
        exec /app/venv/bin/uvicorn main:app \
          --host 0.0.0.0 --port 8090 \
          --reload --reload-dir /app/src
    ports:
      - "${SKILLS_PORT:-8090}:8090"
    volumes:
      - ${SKILLS_SERVICE_DIR:-./skills-service}/src:/app/src:z
      - ${SKILLS_DIR:-./opl-ai-software-team/skills}:/app/skills/base:ro,z
      - ${FRAPPE_SKILLS_DIR:-/tmp/skills-placeholder}:/app/skills/frappe:ro,z
      - ${SANDBOX_SKILLS_DIR:-/tmp/skills-placeholder}:/app/skills/sandbox:ro,z
      - skills-marketplace-dev:/app/skills/marketplace:ro
      - skills-cache-dev:/app/cache
      - skills-venv:/app/venv
    environment:
      - SKILLS_BASE_DIRS=/app/skills/base,/app/skills/frappe,/app/skills/sandbox,/app/skills/marketplace
      - SKILLS_INDEX_CACHE_DIR=/app/cache
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/app/venv/bin/python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8090/health')\""]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 5
    networks:
      - crew-dev-net

  # ── Skill Manager (write / marketplace) ──────────────────────────────────
  # Profile: skills (same as skills-service).
  # Handles: marketplace search, install, delete, embedded management UI.
  # Writes to skills-marketplace-dev volume; signals skills-service to /reload.
  # UI accessible at http://localhost:8091
  skill-manager:
    profiles: [skills]
    container_name: crew-skill-manager-dev
    image: registry.access.redhat.com/ubi9/python-311:latest
    user: root
    working_dir: /app
    command:
      - sh
      - -c
      - |
        python3 -m venv /app/venv 2>/dev/null || true
        /app/venv/bin/pip install -q --upgrade pip
        /app/venv/bin/pip install -q \
          'fastapi>=0.115.0' \
          'uvicorn[standard]>=0.29.0' \
          'httpx>=0.28.0' \
          'jinja2>=3.1.0' \
          'pyyaml>=6.0.0'
        mkdir -p /app/skills/marketplace
        exec /app/venv/bin/uvicorn main:app \
          --host 0.0.0.0 --port 8091 \
          --reload --reload-dir /app
    ports:
      - "${SKILL_MANAGER_PORT:-8091}:8091"
    volumes:
      - ${SKILL_MANAGER_DIR:-./skill-manager}:/app:z
      - skills-marketplace-dev:/app/skills/marketplace
      - skill-manager-venv:/app/venv
    environment:
      - SKILLS_SERVICE_URL=http://skills-service:8090
      - SKILLS_MARKETPLACE_DIR=/app/skills/marketplace
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - PYTHONUNBUFFERED=1
    depends_on:
      skills-service:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/app/venv/bin/python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8091/api/health')\""]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5
    networks:
      - crew-dev-net

  # ── Frontend: React + PatternFly (Vite dev server) ───────────────────────
  # Default: ubi9/nodejs-20 with source mounted for hot-reload.
  # Scale-out / CI: set FRONTEND_IMAGE=ghcr.io/varkrish/crew-frontend:latest
  #   to use a pre-built Nginx image (no bind-mount, no npm install).
  frontend:
    container_name: crew-frontend-dev
    image: ${FRONTEND_IMAGE:-registry.access.redhat.com/ubi9/nodejs-20:latest}
    user: root
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "${FRONTEND_PORT:-3000}:${FRONTEND_CONTAINER_PORT:-3000}"
    volumes:
      - ./opl-studio-ui:/app:z
      - crew-node-modules:/app/node_modules
    environment:
      - VITE_DEV_PROXY_TARGET=http://backend:8080
      - VITE_SKILL_MANAGER_URL=http://localhost:${SKILL_MANAGER_PORT:-8091}
      - VITE_KEYCLOAK_URL=http://localhost:${KEYCLOAK_PORT:-8180}
      - VITE_KEYCLOAK_REALM=opl-crew
      - VITE_KEYCLOAK_CLIENT_ID=opl-studio
      - VITE_AUTH_ENABLED=${VITE_AUTH_ENABLED:-false}
    depends_on:
      backend:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:${FRONTEND_CONTAINER_PORT:-3000}/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 5
    networks:
      - crew-dev-net

  # ── Jira Server ──────────────────────────────────────────────────────────
  # Profile: jira — heavy image; enable only when testing connector integration.
  jira:
    profiles: [jira]
    container_name: jira-dev
    image: docker.io/atlassian/jira-software:9.4.0
    platform: linux/amd64
    ports:
      - "${JIRA_PORT:-8081}:8080"
    volumes:
      - jira-data-dev:/var/atlassian/application-data/jira
    environment:
      - ATL_JIRA_HOME=/var/atlassian/application-data/jira
    restart: unless-stopped
    networks:
      - crew-dev-net

  # ── Jira Connector ───────────────────────────────────────────────────────
  # Profile: jira (depends on jira + backend).
  connector:
    profiles: [jira]
    container_name: crew-jira-connector-dev
    image: registry.access.redhat.com/ubi9/python-311:latest
    user: root
    working_dir: /app
    command:
      - sh
      - -c
      - |
        python3 -m venv /app/venv 2>/dev/null || true
        /app/venv/bin/pip install -q --upgrade pip
        /app/venv/bin/pip install -q -e /app/src
        exec /app/venv/bin/uvicorn crew_jira_connector.app:app \
          --host 0.0.0.0 --port 8080 \
          --reload --reload-dir /app/src
    ports:
      - "${CONNECTOR_PORT:-8082}:8080"
    volumes:
      - ./crew_jira_connector:/app/src:z
      - connector-venv:/app/venv
      - connector-data-dev:/app/data
    environment:
      - CREW_STUDIO_URL=http://backend:8080
      - JIRA_BACKEND=${JIRA_BACKEND:-rest}
      - JIRA_BASE_URL=${JIRA_BASE_URL:-http://jira:8080}
      - JIRA_EMAIL=${JIRA_EMAIL:-}
      - JIRA_API_TOKEN=${JIRA_API_TOKEN:-}
      - JIRA_USERNAME=${JIRA_USERNAME:-}
      - JIRA_PASSWORD=${JIRA_PASSWORD:-}
      - JIRA_PERSONAL_ACCESS_TOKEN=${JIRA_PERSONAL_ACCESS_TOKEN:-}
      - JIRA_PROJECT_KEYS=${JIRA_PROJECT_KEYS:-}
      - JIRA_TRIGGER_STATUS=${JIRA_TRIGGER_STATUS:-Ready for Dev}
      - JIRA_WEBHOOK_SECRET=${JIRA_WEBHOOK_SECRET:-}
      - LLM_API_BASE_URL=${LLM_API_BASE_URL:-https://litellm-prod.apps.maas.redhatworkshops.io}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-deepseek-r1-distill-qwen-14b}
      - PYTHONUNBUFFERED=1
      - KEYCLOAK_TOKEN_URL=${KEYCLOAK_TOKEN_URL:-http://keycloak:8080/realms/opl-crew/protocol/openid-connect/token}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID:-connector-service}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CONNECTOR_CLIENT_SECRET:-connector-service-secret-12345}
    depends_on:
      backend:
        condition: service_healthy
      jira:
        condition: service_started
      keycloak:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - crew-dev-net

  # ── Context Memory Plane (MemMachine) ─────────────────────────────────────
  # Profile: memory — the P3 historical knowledge plane. Job outcomes, Jira
  # context, and reference-doc summaries are written at lifecycle hooks and
  # recalled at solutioning time.
  #
  #   podman compose -f dev-compose.yml --profile memory up -d
  #
  # The backend is fail-open: with this profile down, jobs run exactly as before.
  # Enable the backend side with MEMORY_ENABLED=true (see .env.example).
  #
  # Host ports avoid the ones already in use: 8080 backend, 8180 keycloak,
  # 8081 jira, 8082 connector.

  # Renders memmachine/configuration.template.yml with secrets from the
  # environment. Keeps API keys out of git — the rendered file lives in a volume,
  # never in the repo.
  memmachine-config:
    profiles: [memory]
    container_name: crew-memmachine-config
    # python-311 rather than ubi-minimal: the substitution is done in Python so
    # secrets never pass through shell or sed quoting. An API key containing & or
    # | breaks a sed replacement, and the failure surfaces as an unreadable YAML
    # parse error inside memmachine-app rather than here.
    image: registry.access.redhat.com/ubi9/python-311:latest
    # The image defaults to UID 1001, which cannot write the named volume.
    user: root
    command:
      - python3
      - -c
      - |
        import os, sys
        # Only the CHAT slot (MemMachine's own retrieval/categorization agent)
        # needs a real key — the embedder runs locally via sentence-transformers,
        # no external API involved. See configuration.template.yml's header note.
        key = os.environ.get("MEMMACHINE_LLM_API_KEY") or os.environ.get("LLM_API_KEY") or ""
        url = (os.environ.get("MEMMACHINE_LLM_BASE_URL")
               or os.environ.get("LLM_API_BASE_URL")
               or "https://api.openai.com/v1")
        if not key:
            print("WARNING: no LLM API key for MemMachine's chat slot — its retrieval agent will fail.", file=sys.stderr)
        subs = {
            "__POSTGRES_PASSWORD__": os.environ.get("MEMMACHINE_POSTGRES_PASSWORD") or "memmachine_password",
            "__NEO4J_PASSWORD__": os.environ.get("MEMMACHINE_NEO4J_PASSWORD") or "neo4j_password",
            "__LLM_API_KEY__": key,
            "__LLM_BASE_URL__": url,
            "__LLM_MODEL__": os.environ.get("MEMMACHINE_LLM_MODEL") or "gpt-4o-mini",
            "__EMBED_MODEL__": os.environ.get("MEMMACHINE_EMBED_MODEL") or "BAAI/bge-small-en-v1.5",
        }
        text = open("/template/configuration.template.yml", encoding="utf-8").read()
        for placeholder, value in subs.items():
            text = text.replace(placeholder, value)
        leftover = [p for p in subs if p in text]
        if leftover:
            print(f"WARNING: unsubstituted placeholders remain: {leftover}", file=sys.stderr)
        with open("/rendered/configuration.yml", "w", encoding="utf-8") as fh:
            fh.write(text)
        print(f"Rendered MemMachine configuration.yml (chat_model={subs['__LLM_MODEL__']}, "
              f"local_embedder={subs['__EMBED_MODEL__']}, chat_key={'set' if key else 'MISSING'})")
    volumes:
      - ./memmachine:/template:z,ro
      - memmachine-config-dev:/rendered
    environment:
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_API_BASE_URL=${LLM_API_BASE_URL:-}
      - MEMMACHINE_LLM_API_KEY=${MEMMACHINE_LLM_API_KEY:-}
      - MEMMACHINE_LLM_BASE_URL=${MEMMACHINE_LLM_BASE_URL:-}
      - MEMMACHINE_LLM_MODEL=${MEMMACHINE_LLM_MODEL:-gpt-4o-mini}
      - MEMMACHINE_EMBED_MODEL=${MEMMACHINE_EMBED_MODEL:-BAAI/bge-small-en-v1.5}
      - MEMMACHINE_POSTGRES_PASSWORD=${MEMMACHINE_POSTGRES_PASSWORD:-memmachine_password}
      - MEMMACHINE_NEO4J_PASSWORD=${MEMMACHINE_NEO4J_PASSWORD:-neo4j_password}
    restart: "no"
    networks:
      - crew-dev-net

  # Profile memory (SQL + vectors)
  memmachine-postgres:
    profiles: [memory]
    container_name: crew-memmachine-postgres
    image: docker.io/pgvector/pgvector:pg16
    ports:
      - "${MEMMACHINE_POSTGRES_PORT:-55432}:5432"
    environment:
      - POSTGRES_DB=memmachine
      - POSTGRES_USER=memmachine
      - POSTGRES_PASSWORD=${MEMMACHINE_POSTGRES_PASSWORD:-memmachine_password}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - memmachine-postgres-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memmachine -d memmachine"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - crew-dev-net

  # Episodic graph memory. Shared with the Phase 7 llm-tldr code graph — one
  # graph DB serves both episodic memory and code structure.
  memmachine-neo4j:
    profiles: [memory]
    container_name: crew-memmachine-neo4j
    image: docker.io/library/neo4j:5.23-community
    ports:
      - "${MEMMACHINE_NEO4J_HTTP_PORT:-7474}:7474"
      - "${MEMMACHINE_NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      - NEO4J_EDITION=community
      - NEO4J_AUTH=neo4j/${MEMMACHINE_NEO4J_PASSWORD:-neo4j_password}
      - NEO4J_server_bolt_thread__pool__max__size=2000
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=1G
      - NEO4J_server_default__listen__address=0.0.0.0
      - NEO4J_server_bolt_listen__address=0.0.0.0:7687
      - NEO4J_server_http_listen__address=0.0.0.0:7474
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
    volumes:
      - memmachine-neo4j-data-dev:/data
      - memmachine-neo4j-logs-dev:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${MEMMACHINE_NEO4J_PASSWORD:-neo4j_password} 'RETURN 1' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    restart: unless-stopped
    networks:
      - crew-dev-net

  # API server (+ MCP server). Reached by the backend at http://memmachine-app:8080.
  memmachine-app:
    profiles: [memory]
    container_name: crew-memmachine-app
    image: ${MEMMACHINE_IMAGE:-docker.io/memmachine/memmachine:latest}
    ports:
      - "${MEMMACHINE_PORT:-8280}:8080"
    environment:
      - HOST=0.0.0.0
      - POSTGRES_HOST=memmachine-postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=memmachine
      - POSTGRES_PASSWORD=${MEMMACHINE_POSTGRES_PASSWORD:-memmachine_password}
      - POSTGRES_DB=memmachine
      - NEO4J_HOST=memmachine-neo4j
      - NEO4J_PORT=7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${MEMMACHINE_NEO4J_PASSWORD:-neo4j_password}
      - MEMORY_CONFIG=/app/configuration.yml
      - MCP_BASE_URL=http://memmachine-app:8080
      - GATEWAY_URL=http://localhost:${MEMMACHINE_PORT:-8280}
      - FAST_MCP_LOG_LEVEL=${FAST_MCP_LOG_LEVEL:-INFO}
      - MEMMACHINE_WORKERS=${MEMMACHINE_WORKERS:-1}
      - LOG_LEVEL=${MEMMACHINE_LOG_LEVEL:-INFO}
      # MemMachine reads OPENAI_API_KEY directly in some code paths even when the
      # key is set in configuration.yml.
      - OPENAI_API_KEY=${MEMMACHINE_LLM_API_KEY:-${LLM_API_KEY:-}}
      - HF_HOME=/hf-cache
    volumes:
      - memmachine-config-dev:/cfg:ro
      - memmachine-logs-dev:/tmp/memory_logs
      # The base image ships without pip (verified: `python3 -m pip` reports
      # "No module named pip"; ensurepip's bundled wheel still works). Caching
      # both pip's own download cache and the downloaded model weights means a
      # `--force-recreate` doesn't re-fetch ~500MB every time.
      - memmachine-pip-cache-dev:/root/.cache/pip
      - memmachine-hf-cache-dev:/hf-cache
    # The rendered config lands in a read-only volume; copy it to the path
    # MEMORY_CONFIG points at, then run the image's own command. That command is
    # `memmachine-server` (from the image config) — do not use `exec a || exec b`
    # to guess it, because a failed exec terminates the shell rather than falling
    # through to the alternative, which surfaces as a bare exit 127 with no logs.
    #
    # sentence-transformers is not in the base image (the local embedder needs
    # it — see configuration.template.yml). Installed here rather than baked
    # into a custom image, matching how every other dev service in this file
    # installs its own deps at startup.
    entrypoint:
      - sh
      - -c
      - |
        cp /cfg/configuration.yml /app/configuration.yml
        /app/.venv/bin/python3 -m ensurepip
        /app/.venv/bin/python3 -m pip install --quiet sentence-transformers
        exec memmachine-server
    depends_on:
      memmachine-config:
        condition: service_completed_successfully
      memmachine-postgres:
        condition: service_healthy
      memmachine-neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/api/v2/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      # First boot installs sentence-transformers (~500MB of torch/transformers
      # wheels) and downloads BAAI/bge-small-en-v1.5 — budget for both before
      # the healthcheck gives up. Cached afterward via the volumes above.
      start_period: 240s
    restart: unless-stopped
    networks:
      - crew-dev-net

  # ── headroom: token-compression proxy (Phase 1) ───────────────────────────
  # Profile: headroom. An OpenAI-compatible proxy that sits in front of the
  # configured LLM endpoint and compresses request context.
  #
  #   podman compose -f dev-compose.yml --profile headroom up -d
  #
  # To route agents through it, set in .env:
  #   LLM_API_BASE_URL=http://headroom:8787/v1
  #   HEADROOM_UPSTREAM_URL=<your real endpoint, e.g. https://litellm-prod…/v1>
  #
  # LIMITATION — BYOK bypasses this. Per-user base URLs stored in
  # user_llm_configs are used verbatim, so those calls go straight to the user's
  # provider. Only the server-default endpoint is compressed unless each user
  # also points their base URL here.
  headroom:
    profiles: [headroom]
    container_name: crew-headroom-dev
    image: ${HEADROOM_IMAGE:-ghcr.io/chopratejas/headroom:latest}
    entrypoint: ["headroom"]
    command:
      - proxy
      - --host
      - 0.0.0.0
      - --port
      - "8787"
      - --stateless
      - --mode
      - ${HEADROOM_MODE:-cache}
      - --provider-name
      - ${HEADROOM_PROVIDER_NAME:-OPL-Upstream}
    ports:
      - "${HEADROOM_PORT:-8787}:8787"
    environment:
      # Where headroom forwards OpenAI-compatible traffic. Must be the REAL
      # upstream, never the proxy itself, or requests loop.
      - OPENAI_TARGET_API_URL=${HEADROOM_UPSTREAM_URL:-${LLM_API_BASE_URL:-https://litellm-prod.apps.maas.redhatworkshops.io/v1}}
      - HEADROOM_STATELESS=true
      - HEADROOM_TELEMETRY=off
      - HEADROOM_MODE=${HEADROOM_MODE:-cache}
    restart: unless-stopped
    networks:
      - crew-dev-net

volumes:
  # Python venvs — persist installed packages; rebuilt only if volume removed
  backend-venv:
    driver: local
  validator-venv:
    driver: local
  skills-venv:
    driver: local
  skill-manager-venv:
    driver: local
  connector-venv:
    driver: local
  # Marketplace skills — writable by skill-manager, read-only for skills-service
  skills-marketplace-dev:
    driver: local
  # App data
  crew-workspace-dev:
    driver: local
  crew-data-dev:
    driver: local
  backend-cache-dev:
    driver: local
  skills-cache-dev:
    driver: local
  connector-data-dev:
    driver: local
  jira-data-dev:
    driver: local
  # Frontend
  crew-node-modules:
    driver: local
  # Keycloak
  keycloak-data-dev:
    driver: local
  # Context memory plane (profile: memory)
  memmachine-config-dev:
    driver: local
  memmachine-postgres-dev:
    driver: local
  memmachine-neo4j-data-dev:
    driver: local
  memmachine-neo4j-logs-dev:
    driver: local
  memmachine-logs-dev:
    driver: local
  # Caches for the local sentence-transformers embedder installed at startup —
  # survive a --force-recreate without re-downloading ~500MB.
  memmachine-pip-cache-dev:
    driver: local
  memmachine-hf-cache-dev:
    driver: local

networks:
  crew-dev-net:
    driver: bridge
